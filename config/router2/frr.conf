frr defaults traditional
hostname router2
log syslog informational
!
interface lo
 ip address 10.2.2.2/32
!
router bgp 65002
 bgp router-id 10.2.2.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 timers bgp 3 9
 neighbor 10.0.12.2 remote-as 65001
 neighbor 10.0.12.2 description R1-eBGP
 !
 address-family ipv4 unicast
  network 10.2.2.2/32
  neighbor 10.0.12.2 activate
  redistribute ospf
 exit-address-family
!
router ospf
 ospf router-id 10.2.2.2
 timers throttle spf 100 400 10000
 network 10.0.23.0/29 area 0
 network 10.2.2.2/32 area 0
 redistribute bgp
!
line vty
!
